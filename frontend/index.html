<style>

    --teal: #1B3A5F;
    --tealMid: #2A4F7A;
    --reed: #2F8F5B;
    --reedSoft: #E3F5EA;
    --gold: #1B3A5F;
    --goldSoft: #E8EEF6;
    --accent: #F07A1A;
    --accentSoft: #FFE8D4;
    --danger: #C0453A;
    --dangerSoft: #F8E0DD;

      linear-gradient(180deg, #F8F4EF 0%, #EEF3F8 42%, #E6EEF6 100%);

  input, select, textarea, button { font-family: inherit; }
  ::placeholder { color: var(--muted); opacity: 0.75; }
  button { cursor: pointer; }

  a.call-link[href^="tel:"] { pointer-events: auto !important; color: #fff !important; cursor: pointer; }
  .app-shell {
    width: 100%;
    max-width: none;
    margin: 0;

    display: grid;

      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 24px;
      align-items: start;

  @media (min-width: 1200px) {

  .nav-item { transition: color 0.15s ease; }
  .empty-well {
    width: 64px; height: 64px; border-radius: 18px;

    background: linear-gradient(160deg, #E8EEF6, #F5F8FC);

  @keyframes slideIn { from { transform: translateY(-12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes slideInRight { from { transform: translateX(28px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes alertGlow {

    background: #fff;

  .notify-dot {
    position: absolute;
    top: -2px;
    right: -2px;
    width: 12px;
    height: 12px;
    border-radius: 99px;
    background: var(--accent);
    border: 2px solid #fff;
    animation: notifyPulse 1.35s ease-out infinite;

  @keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.55; transform: scale(0.85); } }

  .login-screen {
    height: 100dvh;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    padding: 36px 18px;
    background:
      radial-gradient(520px 280px at 12% 0%, rgba(240, 122, 26, 0.38), transparent 60%),
      radial-gradient(480px 320px at 100% 18%, rgba(61, 220, 132, 0.18), transparent 55%),

  .login-card {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border-radius: 28px;
    padding: 28px 26px 22px;
    box-shadow: 0 28px 70px rgba(6, 16, 32, 0.38);
  }
  .login-field input {
    width: 100%;
    border-radius: 14px;
    padding: 13px 14px;
    font-size: 15px;
    font-weight: 600;
    outline: none;
    border: 1.5px solid #E2E8F0;
    background: #F7F9FC;
    color: var(--ink);
    transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;

  .login-field input:focus {
    border-color: #F07A1A;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(240, 122, 26, 0.15);
  }
  .login-submit {
    margin-top: 6px;
    width: 100%;
    border: none;
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 16px;
    font-weight: 800;
    color: #fff;
    background: linear-gradient(180deg, #F59A45 0%, #E06A12 100%);

  }
  .login-submit:hover { filter: brightness(1.05); }
  .login-submit:disabled { opacity: 0.7; cursor: default; }
</style>

<body>
<div id="root"></div>
<script src="/api.js"></script>
<script>
window.addEventListener("error", function (e) {
  var root = document.getElementById("root");
  if (root && !root.dataset.mounted) {
    root.innerHTML = '<div style="padding:24px;font-family:sans-serif;color:#A6432A">The app hit a loading error: ' +
      (e && e.message ? e.message : "unknown") + '. Please refresh.</div>';
  }
});
</script>
<script>
const h = React.createElement;
const { useState, useEffect, useCallback, useRef } = React;
const SERIF = "Manrope, 'Segoe UI', sans-serif";
const AUTO_SHARE_THRESHOLD = 3;
const PRESENCE_EXPIRY_MS = 3 * 60 * 60 * 1000;
const PICKUP_POINTS = ["OBS Main Gate", "OBS South Entrance"];
const S_KEY = "obs_session_v3";
const EMERGENCY_NUMBER = "9810490218";
const EMERGENCY_TEL = "tel:+91" + EMERGENCY_NUMBER;
const ROUTES = [
  { id: "obs_to_lotus", label: "OBS → Lotus Business Park" },
  { id: "lotus_to_obs", label: "Lotus Business Park → OBS" },
  { id: "other", label: "Other location" },
];
const VEHICLES = ["Car", "Cab", "Auto", "Metro"];
const TIMINGS = [
  "9:30 AM – 5:30 PM",
  "10:00 AM – 7:00 PM",
  "11:00 AM – 8:00 PM",
  "12:00 PM – 9:00 PM",
  "10:30 AM – 7:30 PM",
  "Other timing",
];
const DEFAULT_PROFILE = { route: "obs_to_lotus", vehicle: "Car", timing: TIMINGS[0] };

// ---------- helpers ----------
function initials(name) {
  if (!name) return "?";
  return name.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
}
function plainLabel(text) {
  return String(text || "").replace(/\d{5,}/g, (n) => n.split("").join("\u2060"));
}
function compressImageFile(file, maxSize = 256, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Could not read image"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Invalid image"));
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = d => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
function formatDistance(m) {
  if (m === null || m === undefined || isNaN(m)) return null;
  if (m < 1000) return Math.round(m) + " m away";
  return (m / 1000).toFixed(1) + " km away";
}
function mapsPinUrl(lat, lon) {
  return "https://www.google.com/maps?q=" + encodeURIComponent(lat + "," + lon);
}
function mapsDirectionsUrl(fromLat, fromLon, toLat, toLon) {
  return "https://www.google.com/maps/dir/?api=1&origin=" +
    encodeURIComponent(fromLat + "," + fromLon) +
    "&destination=" + encodeURIComponent(toLat + "," + toLon);
}
let _notifyAudioCtx = null;
function playNotifyDing(kind) {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    _notifyAudioCtx = _notifyAudioCtx || new AC();
    const ctx = _notifyAudioCtx;
    if (ctx.state === "suspended") ctx.resume();
    const now = ctx.currentTime;
    const freqs = kind === "request" ? [740, 988] : [880, 1175];
    freqs.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.14, now + 0.02 + i * 0.07);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.22 + i * 0.09);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + i * 0.07);
      osc.stop(now + 0.32 + i * 0.09);
    });
  } catch (e) { /* ignore autoplay restrictions */ }
}
function tryBrowserPush(title, body) {
  if (!("Notification" in window)) return;
  if (Notification.permission === "granted") {
    try {
      const n = new Notification(title || "ESS Travel Buddy", { body: body || "", silent: true, icon: "/logo.png" });
      setTimeout(() => n.close(), 5000);
    } catch (e) {}
  }
}
function ensureNotifyPermission() {
  if (!("Notification" in window)) return;
  if (Notification.permission === "default") {
    try { Notification.requestPermission(); } catch (e) {}
  }
}
function timeAgo(ts) {
  const diff = Date.now() - ts;
  const min = Math.floor(diff / 60000);
  if (min < 1) return "just now";
  if (min < 60) return min + "m ago";
  const hr = Math.floor(min / 60);
  return hr + "h " + (min % 60) + "m ago";
}
function clockTime(ts) { return new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
function isToday(ts) { const d = new Date(ts), n = new Date(); return d.toDateString() === n.toDateString(); }
function readSession() { try { const raw = localStorage.getItem(S_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
function writeSession(s) { try { localStorage.setItem(S_KEY, JSON.stringify(s)); } catch (e) {} }
function clearSession() { try { localStorage.removeItem(S_KEY); } catch (e) {} }

// ---------- icons ----------
function Icon(props) {
  const { name, size = 18, color = "currentColor", fill = "none" } = props;
  const common = { width: size, height: size, viewBox: "0 0 24 24", fill: fill, stroke: color, strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" };

function routeLabel(idOrProfile) {
  const profile = idOrProfile && typeof idOrProfile === "object" ? idOrProfile : null;
  const id = profile ? profile.route : idOrProfile;
  if (id === "other") {
    const from = profile ? String(profile.routeFrom || "").trim() : "";
    const to = profile ? String(profile.routeTo || "").trim() : "";
    if (from && to) return from + " → " + to;
    return "Other location";
  }
  const found = ROUTES.find(r => r.id === id);
  return found ? found.label : (id || "");

// ---------- Login ----------
function LoginScreen({ onLogin }) {
  const [mode, setMode] = useState("login");
  const [empId, setEmpId] = useState("");
  const [name, setName] = useState("");
  const [password, setPassword] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [error, setError] = useState("");
  const [notice, setNotice] = useState("");
  const [busy, setBusy] = useState(false);

  const goLogin = () => {
    setMode("login");
    setError("");
    setPassword("");
    setNewPassword("");
    setConfirmPassword("");
  };

  const goReset = () => {
    setMode("reset");
    setError("");
    setNotice("");
    setPassword("");
    setNewPassword("");
    setConfirmPassword("");
  };

  const submitLogin = async (e) => {
    e.preventDefault();
    if (!empId.trim() || !name.trim() || !password) {
      setError("Employee ID, display name, and password are required.");
      return;
    }
    if (password.length < 4) {
      setError("Password must be at least 4 characters.");
      return;
    }
    setError("");
    setNotice("");
    setBusy(true);
    try {
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ empId: empId.trim(), name: name.trim(), password }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        setError(data.error || "Login failed. Check Employee ID and password.");
        setBusy(false);
        return;
      }
      onLogin({ empId: data.empId, name: data.name, verified: true });
    } catch (err) {
      setError("Cannot reach server. Is the backend running?");
      setBusy(false);
    }
  };

  const submitReset = async (e) => {
    e.preventDefault();
    if (!empId.trim() || !newPassword || !confirmPassword) {
      setError("Employee ID, new password, and confirmation are required.");
      return;
    }
    if (newPassword.length < 4) {
      setError("Password must be at least 4 characters.");
      return;
    }
    if (newPassword !== confirmPassword) {
      setError("New password and confirmation do not match.");
      return;
    }
    setError("");
    setNotice("");
    setBusy(true);
    try {
      const res = await fetch("/api/auth/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          empId: empId.trim(),
          newPassword,
          confirmPassword,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        setError(data.error || "Could not reset password.");
        setBusy(false);
        return;
      }
      setNewPassword("");
      setConfirmPassword("");
      setPassword("");
      setMode("login");
      setNotice("Password updated. Log in with your new password.");
      setBusy(false);
    } catch (err) {
      setError("Cannot reach server. Is the backend running?");
      setBusy(false);
    }
  };

  const brand = h("div", { className: "flex flex-col items-center mb-6" },
    h("img", {
      src: "/logo.png",
      alt: "ESS Travel Buddy",
      style: { height: 52, width: "auto", maxWidth: "80%", objectFit: "contain", display: "block" },
    }),
    h("h1", { className: "text-[28px] text-center font-extrabold mt-4", style: { fontFamily: SERIF, color: "var(--ink)", letterSpacing: "-0.03em" } }, "ESS Travel Buddy"),
    h("p", { className: "mt-1 text-sm text-center", style: { color: "var(--muted)" } }, "Sharing Journeys, Building Connections")
  );

  return h("div", { className: "login-screen" },
    h("div", { className: "login-card" },
      brand,
      mode === "reset"
        ? h("form", { onSubmit: submitReset, className: "flex flex-col gap-3" },
            h("div", null,
              h("div", { className: "text-lg font-extrabold", style: { color: "var(--ink)" } }, "Reset password"),
              h("p", { className: "text-xs mt-1 leading-relaxed", style: { color: "var(--muted)" } }, "Enter your Employee ID and choose a new password. You will log in again with it.")
            ),
            h(Field, { label: "Employee ID", value: empId, onChange: setEmpId, placeholder: "Enter employee ID" }),
            h(Field, { label: "New password", value: newPassword, onChange: setNewPassword, placeholder: "Enter new password", type: "password" }),
            h(Field, { label: "Confirm new password", value: confirmPassword, onChange: setConfirmPassword, placeholder: "Re-enter new password", type: "password" }),
            error && h("p", { className: "text-sm", style: { color: "var(--danger)" } }, error),
            h("button", { type: "submit", disabled: busy, className: "login-submit" }, busy ? "Updating…" : "Reset password"),
            h("button", {
              type: "button", onClick: goLogin,
              className: "w-full text-sm font-bold py-1",
              style: { color: "var(--accent)", background: "none" },
            }, "Back to log in")
          )
        : h("form", { onSubmit: submitLogin, className: "flex flex-col gap-3" },
            h(Field, { label: "Employee ID", value: empId, onChange: setEmpId, placeholder: "Enter employee ID" }),
            h(Field, { label: "Display name", value: name, onChange: setName, placeholder: "Enter your full name" }),
            h(Field, { label: "Password", value: password, onChange: setPassword, placeholder: "Enter password", type: "password" }),
            h("button", {
              type: "button", onClick: goReset,
              className: "self-end text-xs font-bold -mt-1",
              style: { color: "var(--accent)", background: "none" },
            }, "Forgot password?"),
            error && h("p", { className: "text-sm", style: { color: "var(--danger)" } }, error),
            notice && h("p", { className: "text-sm", style: { color: "var(--reed)" } }, notice),
            h("button", { type: "submit", disabled: busy, className: "login-submit" }, busy ? "Signing in…" : "Log in")
          ),
      h("p", { className: "mt-5 text-xs text-center leading-relaxed", style: { color: "var(--muted)" } }, "First login with a new Employee ID creates your account. Your name and check-in are visible to colleagues.")
    )
  );
}

  return h("div", { className: "login-field" },

    h("input", {

async function lookupPlace(lat, lon) {
  const rough = Number(lat).toFixed(5) + ", " + Number(lon).toFixed(5);
  try {
    const res = await fetch("/api/place?lat=" + encodeURIComponent(lat) + "&lon=" + encodeURIComponent(lon));
    const data = await res.json().catch(() => ({}));
    return (res.ok && data.place) ? data.place : rough;
  } catch (e) {
    return rough;
  }
}

function namedNcrCity(props) {
  const blob = [props.city, props.county, props.district, props.locality, props.state]
    .map(part => String(part || "").toLowerCase())
    .join(" ");
  if (/gurgaon|gurugram|sohna|manesar/.test(blob)) return "Gurugram";
  if (/faridabad|ballabhgarh/.test(blob)) return "Faridabad";
  if (/greater noida|\bnoida\b/.test(blob)) return "Noida";
  if (/ghaziabad|indirapuram|vaishali|vasundhara|sahibabad/.test(blob)) return "Ghaziabad";
  if (/\bdelhi\b/.test(blob)) return "Delhi";
  return "";
}

function boxNcrCity(feature) {
  const coords = feature && feature.geometry && feature.geometry.coordinates;
  if (!coords || coords.length < 2) return "";
  const lon = Number(coords[0]);
  const lat = Number(coords[1]);
  const area = NCR_AREAS.find(item => lon >= item.minLon && lon <= item.maxLon && lat >= item.minLat && lat <= item.maxLat);
  return area ? area.name : "";
}

function ncrAreaName(feature) {
  const props = (feature && feature.properties) || {};
  const named = namedNcrCity(props);
  const boxed = boxNcrCity(feature);
  if (!boxed && !named) return "";
  if (named && boxed) return named;
  return boxed || named;
}

function ncrSuggestionLabel(props, areaName) {
  const parts = [];
  const locality = String(props.district || props.locality || props.city || props.street || "").trim();
  [props.name, locality, areaName].forEach(part => {
    const text = String(part || "").trim();
    const sameCity = text.toLowerCase().replace("gurgaon", "gurugram") === String(areaName || "").toLowerCase();
    if (text && !sameCity && !parts.some(existing => existing.toLowerCase() === text.toLowerCase())) parts.push(text);
  });
  if (areaName && !parts.some(existing => existing.toLowerCase() === areaName.toLowerCase())) parts.push(areaName);
  const pin = String(props.postcode || "").replace(/\D/g, "");
  const label = parts.slice(0, 3).join(", ");
  return pin && label.indexOf(pin) === -1 ? label + " " + pin : label;
}

function ncrSuggestionMatches(query, props) {
  const name = String(props.name || "").toLowerCase();
  const blob = [props.name, props.street, props.district, props.locality, props.city, props.state]
    .map(part => String(part || "").toLowerCase())
    .filter(Boolean)
    .join(" ");
  const tokens = query.toLowerCase().split(/\s+/).filter(token => token.length > 1);
  if (!tokens.length || tokens.some(token => blob.indexOf(token) === -1)) return false;
  if (name && name.indexOf(tokens[0]) === -1) return false;
  return true;
}

async function searchNcrPlaces(query) {
  const url = "https://photon.komoot.io/api/?q=" + encodeURIComponent(query) + "&limit=50&lang=en&bbox=" + NCR_BBOX;
  const res = await fetch(url);
  const data = await res.json().catch(() => ({}));
  const places = [];
  const seen = new Set();
  const rows = [];
  (data.features || []).forEach(feature => {
    const areaName = ncrAreaName(feature);
    if (!areaName) return;
    const props = (feature && feature.properties) || {};
    if (!ncrSuggestionMatches(query, props)) return;
    const pin = String(props.postcode || "").replace(/\D/g, "");
    rows.push({ props, areaName, pin, name: String(props.name || "").trim().toLowerCase() });
  });
  const pinCounts = {};
  rows.forEach(row => {
    if (!row.pin) return;
    const group = row.name + "|" + row.areaName.toLowerCase();
    pinCounts[group] = pinCounts[group] || {};
    pinCounts[group][row.pin] = (pinCounts[group][row.pin] || 0) + 1;
  });
  rows.forEach(row => {
    if (!row.pin) {
      const group = row.name + "|" + row.areaName.toLowerCase();
      const counts = pinCounts[group] || {};
      row.pin = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0] || "";
      if (row.pin) row.props = Object.assign({}, row.props, { postcode: row.pin });
    }
    const label = ncrSuggestionLabel(row.props, row.areaName);
    const key = label.toLowerCase();
    if (!label || seen.has(key)) return;
    seen.add(key);
    places.push(label);
  });
  return places;
}
function looksLikeCoords(text) {
  return /^-?\d{1,3}\.\d+\s*,\s*-?\d{1,3}\.\d+$/.test(String(text || "").trim());
}
function namedPlace() {
  for (let i = 0; i < arguments.length; i++) {
    const text = String(arguments[i] || "").trim();
    if (text && !looksLikeCoords(text)) return text;
  }
  return "";
}
function locationCaption(placeLabel, savedPlace, coords, geoStatus, busy) {
  const named = namedPlace(placeLabel, savedPlace);
  if (named) return named;
  if (busy) return "Finding your location…";
  if (geoStatus === "insecure") return "Open the https link, continue, then allow location";
  if (geoStatus === "denied") return "Allow location in the browser prompt";
  if (geoStatus === "unsupported") return "Location not supported on this device";
  if (coords && coords.lat != null && coords.lon != null) return "Finding your location…";
  return "Finding your location…";
}

function CheckInBanner({ myPresence, geoStatus, placeLabel, myCoords, onCheckIn, onCheckOut, onRefreshLocation, busy }) {

// Each employee only sees personal threads with people they have chatted with,
// plus their ride group. Older messages saved in the shared room stay in that pair's history.
function buildChatThreads(session, messages, profiles, rideRequests) {
  if (!session) return [];
  const threads = [];
  const byId = {};
  const ensure = (peerId, peerName, active) => {
    if (!peerId || peerId === session.empId) return null;
    const id = matchThreadId(session.empId, peerId);
    if (!byId[id]) {
      const profile = profiles[peerId];
      byId[id] = {
        id,
        peerId,
        peerName: peerName || (profile && profile.name) || peerId,
        active: !!active,
        fromGlobal: false,
      };
      threads.push(byId[id]);
    } else if (peerName && byId[id].peerName === peerId) {
      byId[id].peerName = peerName;
    }
    if (active) byId[id].active = true;
    return byId[id];
  };
  (rideRequests || []).forEach(r => {
    if (r.status !== "accepted") return;
    if (r.fromEmpId !== session.empId && r.toEmpId !== session.empId) return;
    const peerId = r.fromEmpId === session.empId ? r.toEmpId : r.fromEmpId;
    const peerName = r.fromEmpId === session.empId ? r.toName : r.fromName;
    ensure(peerId, peerName, true);
  });
  (messages || []).forEach(m => {
    const gid = m.groupId || "";
    if (gid.indexOf("match:") !== 0) return;
    const parts = gid.split(":");
    if (parts.indexOf(session.empId) === -1) return;
    const peerId = parts[1] === session.empId ? parts[2] : parts[1];
    ensure(peerId, m.empId === peerId ? m.name : "", false);
  });
  const globalSenders = {};
  (messages || []).forEach(m => {
    if ((m.groupId || "global") !== "global" || !m.empId) return;
    if (!globalSenders[m.empId]) globalSenders[m.empId] = m.name || "";
  });
  if (globalSenders[session.empId]) {
    Object.keys(globalSenders).forEach(empId => {
      if (empId === session.empId) return;
      const thread = ensure(empId, globalSenders[empId], false);
      if (thread) thread.fromGlobal = true;
    });
  }
  const latest = (thread) => {
    let time = 0;
    (messages || []).forEach(m => {
      if (messageInPersonalThread(m, session, thread) && (m.time || 0) > time) time = m.time || 0;
    });
    return time;
  };
  threads.sort((a, b) => latest(b) - latest(a));
  return threads;
}

function messageInPersonalThread(message, session, thread) {
  if (!message || !session || !thread) return false;
  if (message.groupId === thread.id) return true;
  if ((message.groupId || "global") !== "global" || !thread.fromGlobal) return false;
  return message.empId === session.empId || message.empId === thread.peerId;
}

      ),
      h("textarea", { value: comment, onChange: e => setComment(e.target.value), placeholder: "Optional note — pricing, pickup point clarity, coordination issues, etc.", className: "w-full rounded-lg px-3 py-2 text-sm outline-none mb-2", style: { border: "1px solid var(--border)", minHeight: 70, background: "var(--card)", color: "var(--ink)" } }),
      h("button", { onClick: () => onSubmitFeedback(myGroup.id, rating, comment), disabled: rating === 0, className: "w-full rounded-lg py-2 text-sm font-semibold", style: { background: rating ? "var(--teal)" : "var(--border)", color: rating ? "#fff" : "var(--muted)" } }, "Submit feedback")
    ),
    (myGroup.status === "completed" && feedbackGiven) && h("p", { className: "text-sm text-center", style: { color: "var(--muted)" } }, "Thanks — your feedback was recorded.")
  );
}

// ---------- Bottom nav ----------
function BottomNav({ tab, setTab, chatBadge, requestBadge }) {
  const items = [
    { id: "home", label: "Home", icon: "home" },
    { id: "chat", label: "Chat", icon: "chat" },
    { id: "groups", label: "Groups", icon: "users" },
    { id: "ride", label: "Ride", icon: "car" },
  ];
  return h("nav", {
    className: "bottom-nav z-20",
    "aria-label": "Main",
  },
    h("div", { className: "app-shell flex" },
      items.map((it, idx) => {
        const active = tab === it.id;
        return h("button", {
          key: it.id,
          type: "button",
          onClick: () => setTab(it.id),
          className: "nav-item flex-1 flex flex-col items-center gap-1 py-2.5 relative",
          style: { borderLeft: idx === 0 ? "none" : "1px solid #EEF2F7" },
        },
          h(Icon, { name: it.icon, size: 22, color: active ? "var(--accent)" : "var(--muted)" }),
          h("span", { className: "text-[11px]", style: { color: active ? "var(--accent)" : "var(--muted)", fontWeight: active ? 800 : 600 } }, it.label),
          active && h("div", { style: { position: "absolute", bottom: 4, width: 18, height: 3, borderRadius: 99, background: "var(--accent)" } }),
          (it.id === "chat" && chatBadge) && h("span", { className: "absolute rounded-full", style: { top: 6, right: "28%", width: 8, height: 8, background: "var(--accent)", boxShadow: "0 0 0 2px #fff" } }),
          (it.id === "home" && requestBadge) && h("span", { className: "absolute rounded-full", style: { top: 6, right: "28%", width: 8, height: 8, background: "var(--danger)", boxShadow: "0 0 0 2px #fff" } })
        );
      })
    )
  );
}

// ---------- App ----------
function App() {
  const [session, setSession] = useState(null);
  const [loadingSession, setLoadingSession] = useState(true);
  const [tab, setTab] = useState("home");
  const [chatFocus, setChatFocus] = useState("global");
  const [db, setDb] = useState(null);
  const [dbReady, setDbReady] = useState(false);
  const [showSafety, setShowSafety] = useState(false);

  const [presence, setPresence] = useState({});
  const [profiles, setProfiles] = useState({});
  const [rideRequests, setRideRequests] = useState([]);
  const [groups, setGroups] = useState([]);
  const [chat, setChat] = useState([]);
  const [feedback, setFeedback] = useState([]);
  const [myCoords, setMyCoords] = useState(null);
  const [placeLabel, setPlaceLabel] = useState("");
  const [geoStatus, setGeoStatus] = useState("idle");
  const [checkInBusy, setCheckInBusy] = useState(false);
  const lastSeenChat = useRef(0);
  const [hasNewChat, setHasNewChat] = useState(false);

  const [notifications, setNotifications] = useState([]);
  const pushNotification = useCallback((text, opts = {}) => {
    const id = Date.now() + "-" + Math.random().toString(36).slice(2, 6);
    const kind = opts.kind || "info";
    setNotifications(list => [...list, { id, text, title: opts.title || null, icon: opts.icon || "bell", kind, threadId: opts.threadId || null }]);
    setTimeout(() => setNotifications(list => list.filter(n => n.id !== id)), opts.duration || 6000);
    if (opts.sound !== false && (kind === "chat" || kind === "request" || opts.sound === true)) {
      playNotifyDing(kind === "request" ? "request" : "chat");
    }
    if (kind === "chat" || kind === "request" || opts.push === true) {
      tryBrowserPush(opts.title || "ESS Travel Buddy", text);
    }
  }, []);

  useEffect(() => { setSession(readSession()); setLoadingSession(false); }, []);

  const liveRef = useRef({ db: null, session: null, presence: {} });
  liveRef.current = { db, session, presence };

  useEffect(() => {
    if (!session) return;
    if (!window.isSecureContext) {
      setGeoStatus("insecure");
      return;
    }
    if (!navigator.geolocation) {
      setGeoStatus("unsupported");
      return;
    }
    let cancelled = false;
    let geocodeAt = 0;
    let lastPlace = "";
    const describe = async (lat, lon) => {
      const now = Date.now();
      if (now - geocodeAt < 20000 && lastPlace && !looksLikeCoords(lastPlace)) return lastPlace;
      geocodeAt = now;
      const place = await lookupPlace(lat, lon);
      if (cancelled || looksLikeCoords(place)) return lastPlace;
      lastPlace = place;
      setPlaceLabel(place);
      return place;
    };
    const watchId = navigator.geolocation.watchPosition(
      (pos) => {
        if (cancelled) return;
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        setMyCoords({ lat, lon });
        setGeoStatus("locked");
        describe(lat, lon);
      },
      () => { if (!cancelled) setGeoStatus(prev => prev === "locked" ? prev : "denied"); },
      { enableHighAccuracy: true, maximumAge: 10000, timeout: 12000 }
    );
    return () => {
      cancelled = true;
      navigator.geolocation.clearWatch(watchId);
    };
  }, [session && session.empId]);

  useEffect(() => {
    if (!session || !db || !myCoords) return;
    const me = liveRef.current.presence[session.empId];
    const place = namedPlace(placeLabel, me && me.place);
    if (!place) return;
    const samePlace = !!me && (me.place || "") === place;
    const close = !!me && me.lat != null && haversine(me.lat, me.lon, myCoords.lat, myCoords.lon) < 30;
    if (samePlace && close) return;
    db.doc("presence/" + session.empId).set({
      empId: session.empId,
      name: session.name,
      lat: myCoords.lat,
      lon: myCoords.lon,
      place,
      checkinTime: (me && me.checkinTime) || Date.now(),
    }).catch(() => {});
  }, [db, myCoords, placeLabel, session]);

  useEffect(() => { if (session) ensureNotifyPermission(); }, [session]);

  useEffect(() => {
    let unsubP, unsubProf, unsubReq, unsubG, unsubC, unsubF;
    let cancelled = false;
    (async () => {
      try {
        if (!window.EssTravelApi || !window.EssTravelApi.createDbClient) {
          setDbReady(true);
          return;
        }
        const dbNs = await window.EssTravelApi.createDbClient().init();
        if (cancelled) return;
        setDb(dbNs);
        unsubP = dbNs.collection("presence").onSnapshot(snap => {
          const obj = {}; snap.docs.forEach(d => { if (d.exists) obj[d.id] = d.data(); }); setPresence(obj);
        });
        unsubProf = dbNs.collection("profiles").onSnapshot(snap => {
          const obj = {}; snap.docs.forEach(d => { if (d.exists) obj[d.id] = d.data(); }); setProfiles(obj);
        });
        unsubReq = dbNs.collection("rideRequests").onSnapshot(snap => {
          setRideRequests(snap.docs.filter(d => d.exists).map(d => ({ id: d.id, ...d.data() })));
        });
        unsubG = dbNs.collection("groups").onSnapshot(snap => {
          setGroups(snap.docs.filter(d => d.exists).map(d => ({ id: d.id, ...d.data() })));
        });
        unsubC = dbNs.collection("chat").orderBy("time", "desc").limit(100).onSnapshot(snap => {
          const msgs = snap.docs.filter(d => d.exists).map(d => ({ id: d.id, ...d.data() }));
          setChat(msgs);
        });
        unsubF = dbNs.collection("feedback").onSnapshot(snap => {
          setFeedback(snap.docs.filter(d => d.exists).map(d => ({ id: d.id, ...d.data() })));
        });
        setDbReady(true);
      } catch (err) {
        console.error("Failed to connect to backend:", err);
        setDbReady(true);
      }
    })();
    return () => {
      cancelled = true;
      unsubP && unsubP(); unsubProf && unsubProf(); unsubReq && unsubReq();
      unsubG && unsubG(); unsubC && unsubC(); unsubF && unsubF();
    };
  }, []);

  useEffect(() => { if (tab === "chat") { setHasNewChat(false); lastSeenChat.current = Date.now(); } }, [tab]);

  // notification: new colleague checked in
  const prevPresenceRef = useRef(null);
  useEffect(() => {
    if (prevPresenceRef.current && session) {
      const prevKeys = new Set(Object.keys(prevPresenceRef.current));
      Object.values(presence).forEach(p => {
        if (!prevKeys.has(p.empId) && p.empId !== session.empId) {
          pushNotification(p.name + " just checked in", { title: "Check-in", icon: "mapPin" });
        }
      });
    }
    prevPresenceRef.current = presence;
  }, [presence, session, pushNotification]);

  const activeGroup = session ? groups.find(g => (g.members || []).includes(session.empId) && g.status !== "completed") : null;
  const latestCompletedToday = session
    ? (groups
        .filter(g => g.status === "completed" && g.completedTime && isToday(g.completedTime) && (g.members || []).includes(session.empId))
        .sort((a, b) => (b.completedTime || 0) - (a.completedTime || 0))[0] || null)
    : null;
  const myGroup = activeGroup;
  const rideGroup = activeGroup || latestCompletedToday;
  const matchThreads = buildChatThreads(session, chat, profiles, rideRequests);
  const chatGroup = myGroup || (session
    ? (groups.filter(g => (g.members || []).includes(session.empId)).sort((a, b) => (b.createdTime || 0) - (a.createdTime || 0))[0] || null)
    : null);

  // notification: my group became ready
  const prevGroupStatusRef = useRef(null);
  useEffect(() => {
    const status = myGroup ? myGroup.status : null;
    if (myGroup && prevGroupStatusRef.current !== "ready" && status === "ready") {
      pushNotification("Meet at " + myGroup.pickupPoint, { title: "Ride ready", icon: "car" });
    }
    prevGroupStatusRef.current = status;
  }, [myGroup && myGroup.status, myGroup && myGroup.pickupPoint]);

  // notification: new chat message → right-side popup (skip history on load)
  const seenChatIds = useRef(new Set());
  useEffect(() => {
    if (!session) return;
    const myGroupId = myGroup ? myGroup.id : null;
    const now = Date.now();
    chat.forEach(m => {
      if (!m.id || seenChatIds.current.has(m.id)) return;
      seenChatIds.current.add(m.id);
      if (m.empId === session.empId) return;
      // Ignore old messages that were already in the server when we opened the app
      if (!m.time || now - m.time > 45000) return;
      const matchForMe = !!(m.groupId && m.groupId.indexOf("match:") === 0 && m.groupId.split(":").slice(1).indexOf(session.empId) !== -1);
      const legacyForMe = (m.groupId || "global") === "global" && chat.some(other => other.empId === session.empId && (other.groupId || "global") === "global");
      const forMe = (myGroupId && m.groupId === myGroupId) || matchForMe || legacyForMe;
      if (!forMe) return;
      const preview = (m.text || "").length > 90 ? (m.text.slice(0, 90) + "…") : (m.text || "");
      const personalId = matchForMe ? m.groupId : (legacyForMe ? matchThreadId(session.empId, m.empId) : "mine");
      const scopeLabel = personalId === "mine" ? "Group chat" : "Personal chat";
      pushNotification((m.name || "Colleague") + ": " + preview, { title: scopeLabel, icon: "chat", kind: "chat", threadId: personalId });
      if (tab !== "chat") setHasNewChat(true);
    });
  }, [chat, session, myGroup && myGroup.id, tab, pushNotification]);

  // notification: incoming ride interest
  const seenRequestIds = useRef(new Set());
  useEffect(() => {
    if (!session) return;
    const now = Date.now();
    rideRequests.forEach(r => {
      if (!r.id || seenRequestIds.current.has(r.id)) return;
      seenRequestIds.current.add(r.id);
      if (r.toEmpId !== session.empId || r.status !== "pending") return;
      if (!r.createdTime || now - r.createdTime > 45000) return;
      pushNotification((r.fromName || "Colleague") + " wants to ride with you", { title: "Ride request", icon: "car", kind: "request" });
    });
  }, [rideRequests, session, pushNotification]);

  const handleLogin = (s) => { writeSession(s); setSession(s); };
  const handleLogout = () => { clearSession(); setSession(null); };

  const doCheckIn = async (lat, lon) => {
    if (!db || !session) return;
    let place = "";
    if (lat != null && lon != null) {
      place = await lookupPlace(lat, lon);
      if (!looksLikeCoords(place)) setPlaceLabel(place);
      else place = "";
    }
    await db.doc("presence/" + session.empId).set({ empId: session.empId, name: session.name, lat, lon, place, checkinTime: Date.now() });
  };

  const handleCheckIn = () => {
    setCheckInBusy(true);
    if (!navigator.geolocation) { setGeoStatus("unsupported"); doCheckIn(null, null).finally(() => setCheckInBusy(false)); return; }
    navigator.geolocation.getCurrentPosition(
      async (pos) => { const { latitude, longitude } = pos.coords; setMyCoords({ lat: latitude, lon: longitude }); setGeoStatus("locked"); await doCheckIn(latitude, longitude); setCheckInBusy(false); },
      async () => { setGeoStatus("denied"); await doCheckIn(null, null); setCheckInBusy(false); },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
    );
  };

  const handleRefreshLocation = () => {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(
      async (pos) => { const { latitude, longitude } = pos.coords; setMyCoords({ lat: latitude, lon: longitude }); setGeoStatus("locked"); await doCheckIn(latitude, longitude); },
      () => setGeoStatus("denied"),
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  };

  const handleCheckOut = async () => {
    if (!db || !session) return;
    await db.doc("presence/" + session.empId).delete();
    const g = groups.find(g => g.members.includes(session.empId) && g.status !== "completed");
    if (g) {
      const newMembers = g.members.filter(m => m !== session.empId);
      if (newMembers.length === 0) { await db.doc("groups/" + g.id).delete(); }
      else { const newNames = { ...(g.memberNames || {}) }; delete newNames[session.empId]; await db.doc("groups/" + g.id).update({ members: newMembers, memberNames: newNames }); }
    }
  };

  const handleCreateGroup = async (name, pickupPoint) => {
    if (!db || !session) return;
    await db.collection("groups").add({ name: name || (session.name.split(" ")[0] + "'s group"), members: [session.empId], memberNames: { [session.empId]: session.name }, createdTime: Date.now(), status: "forming", pickupPoint });
  };
  const handleJoinGroup = async (groupId) => {
    if (!db || !session) return;
    const ref = db.doc("groups/" + groupId);
    const snap = await ref.get();
    if (!snap.exists) return;
    const data = snap.data();
    if (data.members.includes(session.empId)) return;
    const members = [...data.members, session.empId];
    const memberNames = { ...(data.memberNames || {}), [session.empId]: session.name };
    const status = members.length >= AUTO_SHARE_THRESHOLD ? "ready" : data.status;
    await ref.update({ members, memberNames, status });
  };
  const handleLeaveGroup = async (groupId) => {
    if (!db) return;
    const ref = db.doc("groups/" + groupId);
    const snap = await ref.get();
    if (!snap.exists) return;
    const data = snap.data();
    const members = data.members.filter(m => m !== session.empId);
    if (members.length === 0) { await ref.delete(); return; }
    const memberNames = { ...(data.memberNames || {}) };
    delete memberNames[session.empId];
    const status = members.length >= AUTO_SHARE_THRESHOLD ? "ready" : (data.status === "ready" ? "forming" : data.status);
    await ref.update({ members, memberNames, status });
  };
  const handleStartRide = async (groupId) => { if (db) await db.doc("groups/" + groupId).update({ status: "departed" }); };
  const handleCompleteRide = async (groupId) => { if (db) await db.doc("groups/" + groupId).update({ status: "completed", completedTime: Date.now() }); };
  const handleSubmitFeedback = async (groupId, rating, comment) => {
    if (!db || !session) return;
    await db.collection("feedback").add({ groupId, empId: session.empId, rating, comment, time: Date.now() });
  };
  const handleSend = async (text, scope) => {
    if (!db || !session) return;
    let groupId = "";
    if (scope === "mine" && chatGroup) groupId = chatGroup.id;
    else if (typeof scope === "string" && scope.indexOf("match:") === 0) groupId = scope;
    if (!groupId) return;
    await db.collection("chat").add({ empId: session.empId, name: session.name, text, time: Date.now(), groupId });
  };

  const handleSaveProfile = async (profile) => {
    if (!db || !session) throw new Error("not ready");
    await db.doc("profiles/" + session.empId).set({ empId: session.empId, ...profile });
  };

  const handleOpenMatchChat = (partner) => {
    if (!session || !partner) return;
    setChatFocus(matchThreadId(session.empId, partner.empId));
    setTab("chat");
    setHasNewChat(false);
    lastSeenChat.current = Date.now();
  };

  const handleSendRequest = async (partner) => {
    if (!db || !session) return;
    await db.collection("rideRequests").add({
      fromEmpId: session.empId,
      fromName: session.name,
      toEmpId: partner.empId,
      toName: partner.name,
      status: "pending",
      createdTime: Date.now(),
    });
    pushNotification("Request sent to " + partner.name, { title: "Ride request", icon: "car" });
  };

  const handleAcceptRequest = async (req) => {
    if (!db || !session) return;
    let groupId = myGroup && myGroup.id;
    if (!groupId) {
      const created = await db.collection("groups").add({
        name: (session.name.split(" ")[0] || "Ride") + " + " + (req.fromName.split(" ")[0] || "partner"),
        members: [session.empId, req.fromEmpId],
        memberNames: { [session.empId]: session.name, [req.fromEmpId]: req.fromName },
        createdTime: Date.now(),
        status: "forming",
        pickupPoint: PICKUP_POINTS[0],
      });
      groupId = created && created.id;
    } else if (!myGroup.members.includes(req.fromEmpId)) {
      const members = [...myGroup.members, req.fromEmpId];
      const memberNames = { ...(myGroup.memberNames || {}), [req.fromEmpId]: req.fromName };
      const status = members.length >= AUTO_SHARE_THRESHOLD ? "ready" : myGroup.status;
      await db.doc("groups/" + myGroup.id).update({ members, memberNames, status });
    }
    await db.doc("rideRequests/" + req.id).update({ status: "accepted", groupId: groupId || null });
    pushNotification(req.fromName + " added to your ride group", { title: "Accepted", icon: "check" });
    setTab("groups");
  };

  const handleDeclineRequest = async (req) => {
    if (!db) return;
    await db.doc("rideRequests/" + req.id).update({ status: "declined" });
  };

  const handleUnmatch = async (partner) => {
    if (!db || !session || !partner) return;
    const name = partner.name || "this colleague";
    if (!window.confirm("End the chat with " + name + "? Either of you can send a new request later.")) return;
    const related = rideRequests.filter(r =>
      r.status === "accepted" &&
      ((r.fromEmpId === session.empId && r.toEmpId === partner.empId) || (r.toEmpId === session.empId && r.fromEmpId === partner.empId))
    );
    await Promise.all(related.map(r => db.doc("rideRequests/" + r.id).update({ status: "ended" })));
    if (chatFocus === matchThreadId(session.empId, partner.empId)) setChatFocus("global");
    pushNotification("Chat with " + name + " ended", { title: "Chat ended", icon: "x" });
  };

  if (loadingSession) return h("div", { style: { minHeight: "100vh", background: "var(--teal)" } });
  if (!session) return h(LoginScreen, { onLogin: handleLogin });

  const presenceList = Object.values(presence).filter(p => Date.now() - p.checkinTime < PRESENCE_EXPIRY_MS);
  const myPresence = presence[session.empId];
  const feedbackGiven = rideGroup && feedback.some(f => f.groupId === rideGroup.id && f.empId === session.empId);
  const pendingRequests = rideRequests.filter(r => r.toEmpId === session.empId && r.status === "pending").length;

  const isChat = tab === "chat";

  return h("div", {
    style: {
      height: "100dvh",
      minHeight: "100vh",
      display: "flex",
      flexDirection: "column",
      overflow: "hidden",
      maxWidth: "100%",
    },
  },
    h(NotificationStack, {
      notifications,
      onOpen: (n) => {
        if (n.kind === "chat") { if (n.threadId) setChatFocus(n.threadId); setTab("chat"); setHasNewChat(false); lastSeenChat.current = Date.now(); }
        if (n.kind === "request") setTab("home");
        setNotifications(list => list.filter(x => x.id !== n.id));
      },
    }),
    h(TopBar, {
      session,
      photo: profiles[session.empId] && profiles[session.empId].photo,
      onLogout: handleLogout,
      onOpenSafety: () => setShowSafety(true),
      notifications,
      onOpenNotification: (n) => {
        if (n.kind === "chat") { if (n.threadId) setChatFocus(n.threadId); setTab("chat"); setHasNewChat(false); lastSeenChat.current = Date.now(); }
        if (n.kind === "request") setTab("home");
        setNotifications(list => list.filter(x => x.id !== n.id));
      },
    }),
    showSafety && h(SafetyModal, { session, onClose: () => setShowSafety(false) }),
    !dbReady && h("div", { className: "app-shell pt-3 text-xs text-center shrink-0", style: { color: "var(--muted)" } }, "Connecting to live data…"),
    dbReady && !db && h("div", { className: "app-shell pt-3 text-xs text-center shrink-0", style: { color: "var(--danger)" } }, "Cannot reach the backend — start the server (start.bat) and open http://127.0.0.1:5000"),
    !isChat && h(CheckInBanner, { myPresence, geoStatus, placeLabel, myCoords, busy: checkInBusy, onCheckIn: handleCheckIn, onCheckOut: handleCheckOut, onRefreshLocation: handleRefreshLocation }),
    h("div", {
      className: isChat ? "app-shell chat-pane" : "app-shell main-scroll page-pad",
    },
      tab === "home" && h(HomeTab, {
        session, presenceList, myCoords, placeLabel, geoStatus, profiles, rideRequests,
        onSaveProfile: handleSaveProfile,
        onSendRequest: handleSendRequest,
        onAcceptRequest: handleAcceptRequest,
        onDeclineRequest: handleDeclineRequest,
        onOpenMatchChat: handleOpenMatchChat,
        onUnmatch: handleUnmatch,
        pushNotification,
      }),
      tab === "chat" && h(ChatTab, { messages: chat, session, myGroup: chatGroup, matchThreads, chatFocus, presenceMap: presence, myCoords, profiles, onSend: handleSend, onUnmatch: handleUnmatch }),
      tab === "groups" && h(GroupsTab, { groups, session, myGroup, onCreate: handleCreateGroup, onJoin: handleJoinGroup, onLeave: handleLeaveGroup }),
      tab === "ride" && h(RideTab, { myGroup: rideGroup, session, groups, feedback, onStart: handleStartRide, onComplete: handleCompleteRide, onSubmitFeedback: handleSubmitFeedback, feedbackGiven })
    ),
    h(BottomNav, { tab, setTab, chatBadge: hasNewChat, requestBadge: pendingRequests > 0 })
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
document.getElementById("root").dataset.mounted = "true";
root.render(h(App));
</script>
</body>
</html>
